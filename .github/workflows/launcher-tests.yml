name: Source tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "test_data/**"
      - "CMakeLists.txt"
      - ".github/workflows/launcher-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "test_data/**"
      - "CMakeLists.txt"
      - ".github/workflows/launcher-tests.yml"

permissions:
  contents: read

jobs:
  launcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test memory limits and NUMA reservations
        run: |
          python3 -B tests/test_megahit_driver.py -v
          python3 -B tests/test_auto_numa.py -v

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ zlib1g-dev gzip bzip2
      - name: Build all CPU variants
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Test exact assembly outputs in every CPU variant
        run: |
          for core in megahit_core megahit_core_popcnt megahit_core_no_hw_accel; do
            MEGAHIT_TEST_CORE="${PWD}/build/${core}" \
              python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          done
          cmake --build build --target check_stream_stores check_local_minimizer_gate --parallel 2
      - name: Test the built launcher
        run: |
          build/megahit --test -t 2
          build/megahit --test -t 2 --no-hw-accel
